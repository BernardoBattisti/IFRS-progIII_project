server:
  port: ${PORT:8080}
  # Atrás do proxy do Next.js: respeita X-Forwarded-* quando enviados.
  forward-headers-strategy: framework

spring:
  application:
    name: votacoes
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:votacoes}}
    username: ${POSTGRES_USER:votacoes}
    password: ${POSTGRES_PASSWORD:votacoes}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  # SMTP (recuperação de senha). Padrão: Mailpit do Docker Compose, sem autenticação nem TLS.
  # Com MAIL_USERNAME preenchido, a autenticação SMTP é ligada (ConfigEmail).
  mail:
    host: ${MAIL_HOST:mailpit}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.starttls.required: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

app:
  base-url: ${APP_BASE_URL:http://localhost:3000}
  jwt-secret: ${APP_JWT_SECRET:}
  jwt-validade: 12h
  upload-dir: ${APP_UPLOAD_DIR:./uploads}
  mail-from: ${MAIL_FROM:nao-responda@votacoes.local}

logging:
  level:
    root: INFO
